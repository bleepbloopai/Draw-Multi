<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw Together</title>
<style>
:root{--bg:#f1f2f6;--panel:#fff;--fg:#1c1e26;--mut:#6b7080;--bd:#d9dce6;--acc:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151b;--panel:#1f212b;--fg:#eceef6;--mut:#9399ad;--bd:#343747;--acc:#818cf8}}
:root[data-theme="dark"]{--bg:#14151b;--panel:#1f212b;--fg:#eceef6;--mut:#9399ad;--bd:#343747;--acc:#818cf8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--bd)}
.g{display:flex;gap:6px;align-items:center}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none;cursor:pointer}
input[type=range]{width:120px;accent-color:var(--acc)}
#dot{width:34px;height:34px;display:grid;place-items:center}
#dot i{display:block;border-radius:50%;background:var(--fg)}
#st{margin-left:auto;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
#st b{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
#st.live b{background:#22c55e}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
#wrap{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.25);touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%;background:#fff}
#cur{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pc{position:absolute;left:0;top:0;transition:left .07s linear,top .07s linear;will-change:left,top}
.pc svg{display:block}
.pc span{position:absolute;left:14px;top:16px;padding:1px 7px;border-radius:9px;background:var(--panel);color:var(--fg);border:2px solid;font-size:12px;white-space:nowrap}
#ring{position:absolute;pointer-events:none;border:1.5px solid #000;border-radius:50%;box-shadow:0 0 0 1.5px #fff;transform:translate(-50%,-50%);display:none}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;padding:20px}
#gate div{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:26px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
#gate h1{margin:0;font-size:22px}
#gate p{margin:0;color:var(--mut)}
#gate input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
#err{color:#ef4444;min-height:18px;font-size:13px}
#go{background:var(--acc);color:#fff;border-color:var(--acc);padding:10px}
</style>
</head>
<body>
<div id="gate"><div>
<h1>🎨 Draw Together</h1>
<p>Pick a username. Everyone online sees your cursor and your drawing live.</p>
<input id="nm" maxlength="16" placeholder="Username" autocomplete="off" autofocus>
<span id="err"></span>
<button id="go">Start drawing</button>
</div></div>

<div id="bar">
<div class="g" id="tools">
<button data-t="brush" class="on" title="Brush (B)">✏️ Brush</button>
<button data-t="eraser" title="Eraser (E)">🧽 Eraser</button>
<button data-t="fill" title="Fill bucket (F)">🪣 Fill</button>
</div>
<div class="g" id="cols"><input type="color" id="pick" value="#e11d48" title="Color"></div>
<div class="g"><input type="range" id="sz" min="1" max="80" value="8" title="Size ( [ and ] )"><div id="dot"><i></i></div><span id="szv">8</span></div>
<div id="st"><b></b><span id="stt">Solo</span></div>
</div>

<div id="stage"><div id="wrap"><canvas id="cv" width="1600" height="900"></canvas><div id="cur"></div><div id="ring"></div></div></div>

<script type="module">
import {isBad,nameOK,cleanName} from "./filter.js";
(function(){
const W=1600,H=900,$=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap'),curL=$('cur'),ring=$('ring');
ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.lineCap=ctx.lineJoin='round';

/* ---------- state ---------- */
let name='',tool='brush',color='#e11d48',size=8,scale=1;
const last={},uid=Math.random().toString(36).slice(2,8);let seq=0;

/* ---------- drawing ---------- */
function paint(m){
  const p=m.p;if(!p.length)return;
  ctx.strokeStyle=ctx.fillStyle=m.e?'#fff':m.c;ctx.lineWidth=m.w;
  let l=last[m.i],k=0;
  if(!l){ctx.beginPath();ctx.arc(p[0],p[1],m.w/2,0,6.2832);ctx.fill();l=[p[0],p[1]];k=2}
  ctx.beginPath();ctx.moveTo(l[0],l[1]);
  for(;k<p.length;k+=2)ctx.lineTo(p[k],p[k+1]);
  ctx.stroke();last[m.i]=[p[p.length-2],p[p.length-1]];
}
function doFill(sx,sy,hex){
  const img=ctx.getImageData(0,0,W,H),d=img.data,n=W*H;
  const f=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const o=(sy*W+sx)*4,r0=d[o],g0=d[o+1],b0=d[o+2];
  if(Math.abs(r0-f[0])+Math.abs(g0-f[1])+Math.abs(b0-f[2])<6)return;
  const near=(i,t)=>Math.abs(d[i]-r0)+Math.abs(d[i+1]-g0)+Math.abs(d[i+2]-b0)<=t;
  const m=new Uint8Array(n),st=[sy*W+sx];
  while(st.length){
    const q=st.pop();if(m[q]||!near(q*4,60))continue;
    const y=(q/W)|0,row=y*W;let l=q-row,r=l;
    while(l>0&&!m[row+l-1]&&near((row+l-1)*4,60))l--;
    while(r<W-1&&!m[row+r+1]&&near((row+r+1)*4,60))r++;
    for(let i=l;i<=r;i++)m[row+i]=1;
    for(const yy of [y-1,y+1]){
      if(yy<0||yy>=H)continue;let on=false;
      for(let i=l;i<=r;i++){const z=yy*W+i,ok=!m[z]&&near(z*4,60);if(ok&&!on)st.push(z);on=ok}
    }
  }
  const out=new Uint8Array(m); /* grow 1px to cover anti-aliased edges */
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const q=y*W+x;
    if(!m[q]&&(m[q-1]||m[q+1]||m[q-W]||m[q+W])&&near(q*4,330))out[q]=1;
  }
  for(let q=0;q<n;q++)if(out[q]){const i=q*4;d[i]=f[0];d[i+1]=f[1];d[i+2]=f[2];d[i+3]=255}
  ctx.putImageData(img,0,0);
}

/* ---------- network (WebSocket to the Worker's Durable Object) ---------- */
const WSURL=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws=null,tries=0;const others=new Map();
const send=(t,d)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({t},d)))};
const num=(v,a,b)=>Number.isFinite(v)?Math.min(b,Math.max(a,v)):a;
const okHex=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);
function cleanStroke(d){
  if(!d||typeof d.i!=='string'||d.i.length>40||!okHex(d.c)||!Array.isArray(d.p)||d.p.length>400)return null;
  const p=[];for(let k=0;k+1<d.p.length;k+=2)p.push(num(d.p[k],0,W),num(d.p[k+1],0,H));
  return{i:d.i,c:d.c,w:num(d.w,1,120),e:d.e?1:0,p};
}
function applyRemote(k,d){
  if(k==='f'){
    if(!d||!okHex(d.c))return;
    doFill(Math.round(num(d.x,0,W-1)),Math.round(num(d.y,0,H-1)),d.c);
  }else{const s=cleanStroke(d);if(s)paint(s)}
}
function rp(){
  renderPeers([{isMe:true,peer:'me',presence:{}},...[...others.values()].map(p=>({isMe:false,peer:p.id,presence:p}))]);
}
function connect(){
  ws=new WebSocket(WSURL);
  ws.onopen=()=>{tries=0;send('hello',{n:name,c:color});status()};
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.t==='init'){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);for(const k in last)delete last[k]}
    else if(m.t==='st')applyRemote('s',m);
    else if(m.t==='fl')applyRemote('f',m);
    else if(m.t==='sync'&&Array.isArray(m.o))m.o.forEach(o=>o&&applyRemote(o.k==='f'?'f':'s',o));
    else if(m.t==='peers'&&Array.isArray(m.list)){others.clear();m.list.forEach(p=>others.set(p.id,p));rp()}
    else if(m.t==='p'&&m.id){others.set(m.id,Object.assign({},others.get(m.id),m));rp()}
    else if(m.t==='left'){others.delete(m.id);rp()}
    else if(m.t==='reject'){alert('That username was rejected.');location.reload()}
  };
  ws.onclose=()=>{others.clear();rp();status();setTimeout(connect,Math.min(8000,500*2**tries++))};
}

/* ---------- cursors / status ---------- */
const pcs=new Map();let online=1;
function renderPeers(peers){
  const seen=new Set();online=peers.length||1;
  for(const p of peers){
    if(p.isMe)continue;
    const pr=p.presence||{};seen.add(p.peer);
    let e=pcs.get(p.peer);
    if(!e){
      const el=document.createElement('div');el.className='pc';
      el.innerHTML='<svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1l13 8-6 2-3 7z" fill="currentColor" stroke="#fff" stroke-width="1.2"/></svg><span></span>';
      curL.appendChild(el);e={el,lab:el.lastChild,n:null};pcs.set(p.peer,e);
    }
    const col=okHex(pr.c)?pr.c:'#888',nm=cleanName(pr.n);
    if(e.n!==nm){e.lab.textContent=nm;e.n=nm}
    e.el.style.color=col;e.lab.style.borderColor=col;
    if(typeof pr.x==='number'&&typeof pr.y==='number'){
      e.el.style.display='';
      e.el.style.left=num(pr.x,0,W)/W*100+'%';e.el.style.top=num(pr.y,0,H)/H*100+'%';
    }else e.el.style.display='none';
  }
  for(const[k,e]of pcs)if(!seen.has(k)){e.el.remove();pcs.delete(k)}
  status();
}
function status(){
  const live=ws&&ws.readyState===1;
  $('st').className=live?'live':'';
  $('stt').textContent=live?online+' online':'Connecting…';
}
let pt=0,pp=null;
function pres(x,y){pp=[x,y];if(!pt)pt=setTimeout(()=>{pt=0;send('p',pp[0]==null?{x:null,y:null}:{x:pp[0],y:pp[1]})},66)}

/* ---------- input ---------- */
let cur=null,pend=[],fl=0;
const pos=e=>{const r=wrap.getBoundingClientRect();return[Math.round(num((e.clientX-r.left)*W/r.width,0,W)),Math.round(num((e.clientY-r.top)*H/r.height,0,H))]};
function flush(){
  if(!cur)return;
  while(pend.length)send('st',{i:cur.i,c:cur.c,w:cur.w,e:cur.e,p:pend.splice(0,200)});
}
wrap.addEventListener('pointerdown',e=>{
  if(e.button>0)return;e.preventDefault();
  const[x,y]=pos(e);
  if(tool==='fill'){
    doFill(Math.min(x,W-1),Math.min(y,H-1),color);
    send('fl',{x:Math.min(x,W-1),y:Math.min(y,H-1),c:color});return;
  }
  wrap.setPointerCapture(e.pointerId);
  cur={i:uid+'-'+(seq++),c:color,w:size,e:tool==='eraser'?1:0,p:[x,y]};
  paint(cur);pend=[x,y];
  fl=setInterval(flush,70);
});
wrap.addEventListener('pointermove',e=>{
  const[x,y]=pos(e);
  if(tool!=='fill'){
    const r=wrap.getBoundingClientRect();
    ring.style.left=e.clientX-r.left+'px';ring.style.top=e.clientY-r.top+'px';ring.style.display='block';
  }
  pres(x,y);
  if(!cur)return;
  const pts=[],ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  let lx=last[cur.i][0],ly=last[cur.i][1];
  for(const c of(ev.length?ev:[e])){
    const q=pos(c);
    if(Math.abs(q[0]-lx)+Math.abs(q[1]-ly)<2)continue;
    pts.push(q[0],q[1]);lx=q[0];ly=q[1];
  }
  if(!pts.length)return;
  const m={i:cur.i,c:cur.c,w:cur.w,e:cur.e,p:pts};
  paint(m);for(const v of pts)pend.push(v);
});
const end=()=>{if(!cur)return;flush();clearInterval(fl);cur=null};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
wrap.addEventListener('pointerleave',()=>{ring.style.display='none';pres(null,null)});

/* ---------- toolbar ---------- */
function setTool(t){
  tool=t;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='fill')ring.style.display='none';
}
$('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTool(b.dataset.t)});
function setColor(c){
  color=c;$('pick').value=c;
  if(tool==='eraser')setTool('brush');
  send('p',{c});
  $('dot').firstChild.style.background=c;
}
['#e11d48','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#7c4a1e','#000000','#9ca3af','#ffffff'].forEach(c=>{
  const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;
  b.onclick=()=>setColor(c);$('cols').appendChild(b);
});
$('pick').addEventListener('input',e=>setColor(e.target.value));
function setSize(v){
  size=num(+v,1,80);$('sz').value=size;$('szv').textContent=size;
  const d=Math.min(30,Math.max(2,size));$('dot').firstChild.style.cssText='width:'+d+'px;height:'+d+'px;background:'+color;
  ring.style.width=ring.style.height=Math.max(4,size*scale)+'px';
}
$('sz').addEventListener('input',e=>setSize(e.target.value));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'&&e.target.type!=='color')return;
  const k=e.key.toLowerCase();
  if(k==='b')setTool('brush');else if(k==='e')setTool('eraser');else if(k==='f')setTool('fill');
  else if(k==='[')setSize(size-(size>20?5:1));else if(k===']')setSize(size+(size>=20?5:1));
});

/* ---------- layout ---------- */
function fit(){
  const s=$('stage'),cs=getComputedStyle(s);
  const aw=s.clientWidth-parseFloat(cs.paddingLeft)*2,ah=s.clientHeight-parseFloat(cs.paddingTop)*2;
  scale=Math.max(.1,Math.min(aw/W,ah/H));
  wrap.style.width=W*scale+'px';wrap.style.height=H*scale+'px';setSize(size);
}
addEventListener('resize',fit);fit();setSize(8);

/* ---------- start ---------- */
try{const v=localStorage.getItem('dt-name');if(v)$('nm').value=v}catch(e){}
function start(){
  const n=$('nm').value.trim().replace(/\s+/g,' ');
  if(!/^[A-Za-z0-9 _.-]{2,16}$/.test(n)&&!isBad(n)){$('err').textContent='Use 2–16 letters, numbers, spaces, _ . -';return}
  if(isBad(n)||!nameOK(n)){$('err').textContent="That username isn't allowed. Try another.";return}
  name=n;try{localStorage.setItem('dt-name',n)}catch(e){}
  $('gate').remove();
  connect();
  status();
}
$('go').onclick=start;
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('nm').addEventListener('input',()=>$('err').textContent='');
})();
</script>
</body>
</html>
